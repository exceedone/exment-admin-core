name: unittest

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'resources/**'
      - 'database/**'
      - 'config/**'
      - 'composer.json'
      - '.github/workflows/unittest.yml'

# The phpunit tests in tests/ are still the ones from open-admin (v6 era). On v7 (Laravel 12) the first
# test loops forever on the login page, and other tests check things that no longer exist, so they are
# not run here until they are rewritten. Exment's own CI checks out exment-admin-core and runs the
# Exment test suite against it (exceedone/exment#1752), which covers the forms, grids and auth.
# This job checks that the package installs on the supported PHP versions and that every PHP file parses.
jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ "8.2", "8.3" ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Composer validate
        run: composer validate --no-check-publish --no-check-lock

      - name: Composer install
        run: composer install --no-interaction --no-progress

      - name: PHP syntax check
        run: |
          find src config database tests -name '*.php' -print0 | xargs -0 -n 1 -P 8 php -l -d display_errors=1 > /tmp/lint.log 2>&1 || { grep -v '^No syntax errors' /tmp/lint.log; exit 1; }
          echo "checked $(grep -c '^No syntax errors' /tmp/lint.log) files"
